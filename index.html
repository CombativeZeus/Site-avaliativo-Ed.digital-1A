<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto com Imagens</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <header>
        <h1>Bem-vindo ao Meu Site</h1>
    </header>

    <section class="hero">
        <img src="https://picsum.photos/1200/400" alt="Imagem de Destaque" class="hero-img">
        <div class="hero-text">
            <h2>Explora a Galeria</h2>
        </div>
    </section>

    <main class="container">
        <div class="gallery">
            <div class="card">
                <img src="https://picsum.photos/300/200?random=1" alt="Natureza">
                <p>Imagem 1: Natureza</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/300/200?random=2" alt="Cidade">
                <p>Imagem 2: Cidade</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/300/200?random=3" alt="Tecnologia">
                <p>Imagem 3: Tecnologia</p>
            </div>
        </div>
        
        <button id="btn-mudar">Trocar Imagens</button>
    </main>

    <script src="script.Js"></script>
</body>
</html>
    </footer>

    <script src="script.js"></script>
</body>
</html>
